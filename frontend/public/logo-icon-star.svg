<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background square with rounded corners for app icon -->
  <rect width="512" height="512" rx="115" fill="url(#bgGradientStar)"/>

  <!-- Main star shape (larger and centered for app icon) -->
  <path d="M 256 80
           L 290 200
           L 420 200
           L 315 280
           L 355 410
           L 256 330
           L 157 410
           L 197 280
           L 92 200
           L 222 200
           Z"
        fill="white"
        stroke="#F57C00"
        stroke-width="8"
        stroke-linejoin="round"/>

  <!-- Bite mark circle (creates the "bitten" effect) -->
  <circle cx="350" cy="180" r="60" fill="url(#bgGradientStar)"/>

  <!-- Subtle inner glow -->
  <path d="M 256 110
           L 275 165
           L 320 165
           L 285 200
           L 300 250"
        fill="none"
        stroke="url(#glowGradient)"
        stroke-width="8"
        stroke-linecap="round"
        opacity="0.5"/>

  <!-- Large sparkle (top right) -->
  <g transform="translate(400, 130)">
    <path d="M 0 -20 L 0 20 M -20 0 L 20 0"
          stroke="white"
          stroke-width="10"
          stroke-linecap="round"
          opacity="0.9"/>
  </g>

  <!-- Medium sparkle (bottom left) -->
  <g transform="translate(130, 390)">
    <path d="M 0 -15 L 0 15 M -15 0 L 15 0"
          stroke="white"
          stroke-width="8"
          stroke-linecap="round"
          opacity="0.8"/>
  </g>

  <!-- Small sparkle (right) -->
  <g transform="translate(430, 280)">
    <path d="M 0 -12 L 0 12 M -12 0 L 12 0"
          stroke="white"
          stroke-width="7"
          stroke-linecap="round"
          opacity="0.7"/>
  </g>

  <!-- Gradients -->
  <defs>
    <linearGradient id="bgGradientStar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB300;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF8F00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6F00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF59D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFE082;stop-opacity:0.3" />
    </linearGradient>
  </defs>
</svg>

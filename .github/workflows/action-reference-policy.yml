name: Deployment Security Policy

on:
  pull_request:
    paths:
      - ".gitignore"
      - ".github/workflows/**"
      - ".github/actions/**"
      - "**/action.yml"
      - "**/action.yaml"
      - "scripts/check-github-action-pins.rb"
      - "scripts/check-github-action-pins.test.rb"
      - "scripts/deploy.sh"
      - "scripts/setup-deploy-sudo.sh"
      - "scripts/test-production-deploy-provenance.sh"
  push:
    branches:
      - main
    paths:
      - ".gitignore"
      - ".github/workflows/**"
      - ".github/actions/**"
      - "**/action.yml"
      - "**/action.yaml"
      - "scripts/check-github-action-pins.rb"
      - "scripts/check-github-action-pins.test.rb"
      - "scripts/deploy.sh"
      - "scripts/setup-deploy-sudo.sh"
      - "scripts/test-production-deploy-provenance.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-action-references:
    name: Validate Deployment Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test action reference policy
        run: ruby scripts/check-github-action-pins.test.rb

      - name: Validate action references
        run: ruby scripts/check-github-action-pins.rb

      - name: Test Production deployment provenance
        run: bash scripts/test-production-deploy-provenance.sh

name: GitHub Action Reference Policy

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - "**/action.yml"
      - "**/action.yaml"
      - "scripts/check-github-action-pins.rb"
      - "scripts/check-github-action-pins.test.rb"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - "**/action.yml"
      - "**/action.yaml"
      - "scripts/check-github-action-pins.rb"
      - "scripts/check-github-action-pins.test.rb"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-action-references:
    name: Validate Action References
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Test action reference policy
        run: ruby scripts/check-github-action-pins.test.rb

      - name: Validate action references
        run: ruby scripts/check-github-action-pins.rb

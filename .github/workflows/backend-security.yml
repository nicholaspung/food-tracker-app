name: Backend Security Checks

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-security.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-scan:
    name: Test And Scan Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.13"
          cache-dependency-path: backend/go.sum

      - name: Verify Go toolchain
        run: |
          go version
          test "$(go env GOVERSION)" = "go1.25.13"

      - name: Run backend tests
        run: go test ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run Go vulnerability scan
        run: govulncheck ./...

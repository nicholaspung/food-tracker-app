name: Mobile Preview

on:
  push:
    branches:
      - main
    paths:
      - "apps/mobile/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/mobile-preview.yml"
  workflow_dispatch:
    inputs:
      force_preview_build:
        description: "Trigger a preview build instead of an OTA update"
        required: false
        type: boolean
        default: false

concurrency:
  group: mobile-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview:
    name: Publish Mobile Preview
    runs-on: ubuntu-latest
    environment:
      name: beta
      url: https://beta.app.yummyrecs.com
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Verify Expo token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is not available to this job."
            echo "If you stored it as an environment secret, it must be attached to the 'beta' GitHub environment."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint mobile app
        run: pnpm lint

      - name: Typecheck mobile app
        run: pnpm typecheck

      - name: Detect preview release type
        id: release_type
        shell: bash
        run: |
          BEFORE_SHA="${{ github.event.before }}"
          EXTRA_PATHS=(package.json pnpm-lock.yaml pnpm-workspace.yaml)

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            CHANGED_FILES="$(git ls-files apps/mobile "${EXTRA_PATHS[@]}")"
          else
            CHANGED_FILES="$(git diff --name-only "$BEFORE_SHA" "${{ github.sha }}" -- apps/mobile "${EXTRA_PATHS[@]}")"
          fi

          printf '%s\n' "$CHANGED_FILES"

          if [ "${{ github.event.inputs.force_preview_build }}" = "true" ]; then
            echo "publish_mode=build" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if printf '%s\n' "$CHANGED_FILES" | grep -Eq '^(apps/mobile/(android/|ios/|app\.json|app\.config\.(js|ts|mjs|cjs)|eas\.json|package\.json)|pnpm-lock\.yaml|pnpm-workspace\.yaml)'; then
            echo "publish_mode=build" >> "$GITHUB_OUTPUT"
          else
            echo "publish_mode=ota" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish preview OTA update
        if: steps.release_type.outputs.publish_mode == 'ota'
        run: |
          eas update \
            --channel preview \
            --environment preview \
            --message "Preview OTA from ${GITHUB_REF_NAME} (${GITHUB_SHA::7})" \
            --non-interactive

      - name: Trigger preview build
        if: steps.release_type.outputs.publish_mode == 'build'
        run: |
          eas build \
            --platform all \
            --profile preview \
            --non-interactive \
            --no-wait

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.release_type.outputs.publish_mode }}" = "build" ]; then
            echo "Triggered an EAS preview build because native-affecting mobile files changed." >> "$GITHUB_STEP_SUMMARY"
            echo "Install the new preview build before expecting OTA updates from this revision." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Published an OTA update to the shared preview channel." >> "$GITHUB_STEP_SUMMARY"
          fi

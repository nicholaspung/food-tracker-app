name: Mobile Preview

on:
  push:
    branches:
      - main
    paths:
      - "apps/mobile/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/mobile-preview.yml"
  workflow_dispatch:
    inputs:
      force_preview_build:
        description: "Force a preview build instead of the default OTA update for manual runs"
        required: false
        type: boolean
        default: false
      build_platform:
        description: "Choose which native platform preview builds should target"
        required: false
        type: choice
        default: ios
        options:
          - ios
          - all
      deploy_target:
        description: "Choose which hosted backend this internal mobile release should target"
        required: false
        type: choice
        default: beta
        options:
          - beta
          - production

concurrency:
  group: mobile-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview:
    name: Publish Mobile Preview
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_target == 'production' && 'production' || 'beta' }}
      url: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_target == 'production' && 'https://app.yummyrecs.com' || 'https://beta.app.yummyrecs.com' }}
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      MOBILE_DEPLOY_TARGET: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_target == 'production' && 'production' || 'beta' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Verify Expo token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is not available to this job."
            echo "If you stored it as an environment secret, it must be attached to the selected GitHub environment."
            exit 1
          fi

      - name: Verify toolchain
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Expo CLI module resolution
        shell: bash
        run: |
          EXPO_PKG_DIR="$(dirname "$(pnpm --dir apps/mobile exec node -p "require.resolve('expo/package.json')")")"
          EXPO_PARENT_DIR="$(dirname "$EXPO_PKG_DIR")"
          WORKSPACE_PNPM_ROOT="$(pnpm root -w)/.pnpm/node_modules"
          echo "NODE_PATH=${EXPO_PKG_DIR}/node_modules:${EXPO_PARENT_DIR}:${WORKSPACE_PNPM_ROOT}${NODE_PATH:+:${NODE_PATH}}" >> "$GITHUB_ENV"

      - name: Verify pinned EAS CLI
        run: pnpm --dir apps/mobile dlx eas-cli@19.0.8 --version

      - name: Lint mobile app
        run: pnpm mobile:lint

      - name: Typecheck mobile app
        run: pnpm mobile:typecheck

      - name: Check mobile unused exports
        run: pnpm mobile:unused-exports

      - name: Resolve mobile release target
        id: release_target
        shell: bash
        run: |
          case "$MOBILE_DEPLOY_TARGET" in
            production)
              echo "build_profile=production-preview" >> "$GITHUB_OUTPUT"
              echo "ota_channel=production-preview" >> "$GITHUB_OUTPUT"
              echo "eas_environment=production" >> "$GITHUB_OUTPUT"
              echo "target_label=production-preview" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "build_profile=preview" >> "$GITHUB_OUTPUT"
              echo "ota_channel=preview" >> "$GITHUB_OUTPUT"
              echo "eas_environment=preview" >> "$GITHUB_OUTPUT"
              echo "target_label=preview" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Resolve mobile build platform
        id: build_platform
        shell: bash
        run: |
          BUILD_PLATFORM="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_platform || 'ios' }}"

          case "$BUILD_PLATFORM" in
            all)
              echo "build_platform=all" >> "$GITHUB_OUTPUT"
              echo "platform_label=iOS and Android" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "build_platform=ios" >> "$GITHUB_OUTPUT"
              echo "platform_label=iOS" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Detect mobile release type
        id: release_type
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.force_preview_build }}" = "true" ]; then
              echo "publish_mode=build" >> "$GITHUB_OUTPUT"
              echo "publish_reason=manual_forced_build" >> "$GITHUB_OUTPUT"
            else
              echo "publish_mode=ota" >> "$GITHUB_OUTPUT"
              echo "publish_reason=manual_default_ota" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          BEFORE_SHA="${{ github.event.before }}"
          EXTRA_PATHS=(package.json pnpm-lock.yaml pnpm-workspace.yaml)

          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            CHANGED_FILES="$(git ls-files apps/mobile "${EXTRA_PATHS[@]}")"
          else
            CHANGED_FILES="$(git diff --name-only "$BEFORE_SHA" "${{ github.sha }}" -- apps/mobile "${EXTRA_PATHS[@]}")"
          fi

          printf '%s\n' "$CHANGED_FILES"

          # apps/mobile/app.config.js only validates environment safety and passes through app.json.
          # Push events must never start EAS builds. Native-affecting changes require a manual build.
          if printf '%s\n' "$CHANGED_FILES" | grep -Eq '^(apps/mobile/(android/|ios/|app\.json|eas\.json|package\.json)|pnpm-lock\.yaml|pnpm-workspace\.yaml)'; then
            echo "publish_mode=blocked_native_change" >> "$GITHUB_OUTPUT"
            echo "publish_reason=push_native_changes_blocked" >> "$GITHUB_OUTPUT"
            {
              echo "Native-affecting mobile files changed, so this push will not publish an OTA update."
              echo "No EAS build was started. Run this workflow manually with force_preview_build=true when a new binary is intended."
            } >&2
            exit 1
          else
            echo "publish_mode=ota" >> "$GITHUB_OUTPUT"
            echo "publish_reason=push_default_ota" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish mobile OTA update
        if: steps.release_type.outputs.publish_mode == 'ota'
        run: |
          pnpm --dir apps/mobile dlx eas-cli@19.0.8 update \
            --channel "${{ steps.release_target.outputs.ota_channel }}" \
            --environment "${{ steps.release_target.outputs.eas_environment }}" \
            --message "${{ steps.release_target.outputs.target_label }} OTA from ${GITHUB_REF_NAME} (${GITHUB_SHA::7})" \
            --non-interactive

      - name: Trigger mobile build
        if: steps.release_type.outputs.publish_mode == 'build'
        run: |
          pnpm --dir apps/mobile dlx eas-cli@19.0.8 build \
            --platform "${{ steps.build_platform.outputs.build_platform }}" \
            --profile "${{ steps.release_target.outputs.build_profile }}" \
            --non-interactive \
            --no-wait

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          case "${{ steps.release_type.outputs.publish_reason }}" in
            manual_forced_build)
              echo "Triggered an EAS ${{ steps.release_target.outputs.target_label }} ${{ steps.build_platform.outputs.platform_label }} build because manual dispatch requested a preview build." >> "$GITHUB_STEP_SUMMARY"
              echo "Install the new build before expecting OTA updates from this revision." >> "$GITHUB_STEP_SUMMARY"
              ;;
            push_native_changes_blocked)
              echo "Native-affecting files changed, so no OTA was published and no EAS build was started." >> "$GITHUB_STEP_SUMMARY"
              echo "Run the workflow manually with force_preview_build=true when a new binary is intended." >> "$GITHUB_STEP_SUMMARY"
              ;;
            manual_default_ota)
              echo "Published a manual OTA update to the ${{ steps.release_target.outputs.ota_channel }} channel." >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "Published an OTA update to the ${{ steps.release_target.outputs.ota_channel }} channel because no native-affecting mobile files changed." >> "$GITHUB_STEP_SUMMARY"
              ;;
          esac

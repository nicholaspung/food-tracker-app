name: Mobile Preview

on:
  push:
    branches:
      - main
    paths:
      - "apps/mobile/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/mobile-preview.yml"
  workflow_dispatch:
    inputs:
      force_preview_build:
        description: "Trigger a preview build instead of an OTA update"
        required: false
        type: boolean
        default: false
      deploy_target:
        description: "Choose which hosted backend this internal mobile release should target"
        required: false
        type: choice
        default: beta
        options:
          - beta
          - production

concurrency:
  group: mobile-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview:
    name: Publish Mobile Preview
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_target == 'production' && 'production' || 'beta' }}
      url: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_target == 'production' && 'https://app.yummyrecs.com' || 'https://beta.app.yummyrecs.com' }}
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      MOBILE_DEPLOY_TARGET: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_target == 'production' && 'production' || 'beta' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install EAS CLI
        run: npm install --global eas-cli@latest

      - name: Verify Expo token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is not available to this job."
            echo "If you stored it as an environment secret, it must be attached to the selected GitHub environment."
            exit 1
          fi

      - name: Verify toolchain
        run: |
          node --version
          pnpm --version
          eas --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint mobile app
        run: pnpm mobile:lint

      - name: Typecheck mobile app
        run: pnpm mobile:typecheck

      - name: Check mobile unused exports
        run: pnpm mobile:unused-exports

      - name: Resolve mobile release target
        id: release_target
        shell: bash
        run: |
          case "$MOBILE_DEPLOY_TARGET" in
            production)
              echo "build_profile=production-preview" >> "$GITHUB_OUTPUT"
              echo "ota_channel=production-preview" >> "$GITHUB_OUTPUT"
              echo "eas_environment=production" >> "$GITHUB_OUTPUT"
              echo "target_label=production-preview" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "build_profile=preview" >> "$GITHUB_OUTPUT"
              echo "ota_channel=preview" >> "$GITHUB_OUTPUT"
              echo "eas_environment=preview" >> "$GITHUB_OUTPUT"
              echo "target_label=preview" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Detect mobile release type
        id: release_type
        shell: bash
        run: |
          BEFORE_SHA="${{ github.event.before }}"
          EXTRA_PATHS=(package.json pnpm-lock.yaml pnpm-workspace.yaml)

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            CHANGED_FILES="$(git ls-files apps/mobile "${EXTRA_PATHS[@]}")"
          else
            CHANGED_FILES="$(git diff --name-only "$BEFORE_SHA" "${{ github.sha }}" -- apps/mobile "${EXTRA_PATHS[@]}")"
          fi

          printf '%s\n' "$CHANGED_FILES"

          if [ "${{ github.event.inputs.force_preview_build }}" = "true" ]; then
            echo "publish_mode=build" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if printf '%s\n' "$CHANGED_FILES" | grep -Eq '^(apps/mobile/(android/|ios/|app\.json|app\.config\.(js|ts|mjs|cjs)|eas\.json|package\.json)|pnpm-lock\.yaml|pnpm-workspace\.yaml)'; then
            echo "publish_mode=build" >> "$GITHUB_OUTPUT"
          else
            echo "publish_mode=ota" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish mobile OTA update
        if: steps.release_type.outputs.publish_mode == 'ota'
        run: |
          cd apps/mobile
          eas update \
            --channel "${{ steps.release_target.outputs.ota_channel }}" \
            --environment "${{ steps.release_target.outputs.eas_environment }}" \
            --message "${{ steps.release_target.outputs.target_label }} OTA from ${GITHUB_REF_NAME} (${GITHUB_SHA::7})" \
            --non-interactive

      - name: Trigger mobile build
        if: steps.release_type.outputs.publish_mode == 'build'
        run: |
          cd apps/mobile
          eas build \
            --platform all \
            --profile "${{ steps.release_target.outputs.build_profile }}" \
            --non-interactive \
            --no-wait

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.release_type.outputs.publish_mode }}" = "build" ]; then
            echo "Triggered an EAS ${{ steps.release_target.outputs.target_label }} build because native-affecting mobile files changed." >> "$GITHUB_STEP_SUMMARY"
            echo "Install the new build before expecting OTA updates from this revision." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Published an OTA update to the ${{ steps.release_target.outputs.ota_channel }} channel." >> "$GITHUB_STEP_SUMMARY"
          fi

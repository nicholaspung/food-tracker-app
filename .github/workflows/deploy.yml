name: Deploy to Beta/Production

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run type check
        run: |
          cd frontend
          npm run build

      - name: Run E2E tests
        run: |
          cd frontend
          npx playwright install --with-deps chromium
          npm run test:e2e
        env:
          CI: true

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30

  deploy-beta:
    name: Deploy to Beta
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    environment:
      name: beta
      url: https://beta.myexperiment.life

    steps:
      - uses: actions/checkout@v3

      - name: Deploy to Beta Environment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /opt/mobile-tracker-app
            git pull origin master
            bash scripts/deploy.sh beta

      - name: Health check Beta
        run: |
          sleep 10
          curl -f https://beta.myexperiment.life/api/health || exit 1

      - name: Beta deployment summary
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Beta deployment completed successfully"
            echo "🌐 Beta App: https://beta.myexperiment.life"
            echo "📋 Review the beta deployment before promoting to production"
          else
            echo "❌ Beta deployment failed"
            echo "📋 Logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi

  deploy-production:
    name: Deploy to Production
    needs: deploy-beta
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    environment:
      name: production
      url: https://myexperiment.life

    steps:
      - uses: actions/checkout@v3

      - name: Deploy to Production Environment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /opt/mobile-tracker-app
            git pull origin master
            bash scripts/deploy.sh production

      - name: Health check Production
        run: |
          sleep 10
          curl -f https://myexperiment.life/api/health || exit 1

      - name: Production deployment summary
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Production deployment completed successfully"
            echo "🌐 Production App: https://myexperiment.life"
          else
            echo "❌ Production deployment failed"
            echo "📋 Logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi

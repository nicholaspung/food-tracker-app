name: Deploy to Beta/Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        type: choice
        options:
          - production
        default: "production"

jobs:
  deploy-beta:
    name: Deploy to Beta
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: beta
      url: https://beta.trackyourfoods.com

    steps:
      - uses: actions/checkout@v3

      - name: Deploy to Beta Environment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /opt/food-tracker-app
            git pull origin main
            bash scripts/deploy.sh beta

      - name: Health check Beta
        run: |
          sleep 10
          curl -f https://beta.trackyourfoods.com/api/health || exit 1

      - name: Beta deployment summary
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Beta deployment completed successfully"
            echo "🌐 Beta App: https://beta.trackyourfoods.com"
            echo "📋 All tests passed locally via pre-push hook"
          else
            echo "❌ Beta deployment failed"
            echo "📋 Logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    environment:
      name: production
      url: https://trackyourfoods.com

    steps:
      - uses: actions/checkout@v3

      - name: Deploy to Production Environment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /opt/food-tracker-app
            git pull origin main
            bash scripts/deploy.sh production

      - name: Health check Production
        run: |
          sleep 10
          curl -f https://trackyourfoods.com/api/health || exit 1

      - name: Production deployment summary
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Production deployment completed successfully"
            echo "🌐 Production App: https://trackyourfoods.com"
            echo "📋 All tests passed locally via pre-push hook"
          else
            echo "❌ Production deployment failed"
            echo "📋 Logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi

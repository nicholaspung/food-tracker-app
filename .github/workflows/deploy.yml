name: Deploy to Beta/Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - beta
          - production
        default: 'production'

jobs:
  test-local:
    name: Run Local Tests (Build Validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run type check and build
        run: |
          cd frontend
          npm run build

      - name: Get Playwright version
        id: playwright-version
        run: |
          cd frontend
          echo "version=$(npm list @playwright/test --json | jq -r '.dependencies["@playwright/test"].version')" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@v3
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          cd frontend
          npx playwright install --with-deps chromium

      - name: Run local E2E tests
        run: |
          cd frontend
          npm run test:e2e:local
        env:
          CI: true

      - name: Upload local test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-local
          path: frontend/playwright-report/
          retention-days: 30

  deploy-beta:
    name: Deploy to Beta
    needs: test-local
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'beta')
    environment:
      name: beta
      url: https://beta.myexperiment.life

    steps:
      - uses: actions/checkout@v3

      - name: Deploy to Beta Environment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /opt/mobile-tracker-app
            git pull origin main
            bash scripts/deploy.sh beta

      - name: Health check Beta
        run: |
          sleep 10
          curl -f https://beta.myexperiment.life/api/health || exit 1

      - name: Beta deployment summary
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Beta deployment completed successfully"
            echo "🌐 Beta App: https://beta.myexperiment.life"
            echo "📋 Full E2E tests will run next to validate the deployment"
          else
            echo "❌ Beta deployment failed"
            echo "📋 Logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi

  test-beta-after-deploy:
    name: Run Beta E2E Tests (Post-Deployment)
    needs: deploy-beta
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'beta')

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Get Playwright version
        id: playwright-version
        run: |
          cd frontend
          echo "version=$(npm list @playwright/test --json | jq -r '.dependencies["@playwright/test"].version')" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@v3
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          cd frontend
          npx playwright install --with-deps chromium

      - name: Run beta E2E tests
        run: |
          cd frontend
          npm run test:e2e:beta
        env:
          CI: true

      - name: Upload beta test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-beta
          path: frontend/playwright-report/
          retention-days: 30

      - name: Upload beta test results JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta-test-results
          path: frontend/test-results/beta-results.json
          retention-days: 30

      - name: Beta test summary
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ All beta E2E tests passed"
            echo "🚀 Beta environment is validated and ready"
            echo "📋 You can now promote to production via manual workflow dispatch"
          else
            echo "❌ Beta E2E tests failed"
            echo "🚫 Production deployment is blocked until tests pass"
            echo "📋 Review test report artifact for details"
          fi

  test-beta-before-prod:
    name: Run Beta E2E Tests (Pre-Production Gate)
    needs: test-local
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Get Playwright version
        id: playwright-version
        run: |
          cd frontend
          echo "version=$(npm list @playwright/test --json | jq -r '.dependencies["@playwright/test"].version')" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@v3
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          cd frontend
          npx playwright install --with-deps chromium

      - name: Run beta E2E tests before production
        run: |
          cd frontend
          npm run test:e2e:beta
        env:
          CI: true

      - name: Upload beta test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-beta-pre-prod
          path: frontend/playwright-report/
          retention-days: 30

      - name: Upload beta test results JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta-test-results-pre-prod
          path: frontend/test-results/beta-results.json
          retention-days: 30

      - name: Production gate summary
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Beta validation passed - proceeding to production deployment"
            echo "🚀 All E2E tests passed against beta environment"
          else
            echo "❌ Beta E2E tests failed"
            echo "🚫 Production deployment is BLOCKED"
            echo "📋 Fix issues in beta environment before promoting to production"
            exit 1
          fi

  deploy-production:
    name: Deploy to Production
    needs: [test-local, test-beta-before-prod]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    environment:
      name: production
      url: https://myexperiment.life

    steps:
      - uses: actions/checkout@v3

      - name: Deploy to Production Environment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /opt/mobile-tracker-app
            git pull origin main
            bash scripts/deploy.sh production

      - name: Health check Production
        run: |
          sleep 10
          curl -f https://myexperiment.life/api/health || exit 1

      - name: Production deployment summary
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Production deployment completed successfully"
            echo "🌐 Production App: https://myexperiment.life"
          else
            echo "❌ Production deployment failed"
            echo "📋 Logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi

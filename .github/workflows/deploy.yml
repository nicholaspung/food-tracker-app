name: Deploy to Beta/Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        type: choice
        options:
          - production
        default: "production"

jobs:
  deploy-beta:
    name: Deploy to Beta
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: beta
      url: https://beta.app.yummyrecs.com

    steps:
      - uses: actions/checkout@v5

      - name: Deploy to Beta Environment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 30m
          envs: GEMINI_API_KEY,GOOGLE_PLACES_API_KEY,POSTHOG_API_KEY,POSTHOG_HOST,SUDO_PASSWORD,FOOD_TRACKER_IOS_TEAM_ID,FOOD_TRACKER_ANDROID_SHA256_CERT_FINGERPRINTS
          script: |
            export GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}"
            export GOOGLE_PLACES_API_KEY="${{ secrets.GOOGLE_PLACES_API_KEY }}"
            export POSTHOG_API_KEY="${{ secrets.POSTHOG_API_KEY }}"
            export POSTHOG_HOST="${{ secrets.POSTHOG_HOST }}"
            export SUDO_PASSWORD="${{ secrets.SUDO_PASSWORD }}"
            export FOOD_TRACKER_IOS_TEAM_ID="${{ secrets.FOOD_TRACKER_IOS_TEAM_ID }}"
            export FOOD_TRACKER_ANDROID_SHA256_CERT_FINGERPRINTS="${{ secrets.FOOD_TRACKER_ANDROID_SHA256_CERT_FINGERPRINTS }}"
            cd /opt/food-tracker-app
            git pull origin main
            bash scripts/deploy.sh beta

      - name: Health check Beta
        run: |
          for attempt in {1..10}; do
            if curl -fsS https://beta.app.yummyrecs.com/api/health > /dev/null; then
              exit 0
            fi
            echo "Waiting for beta API health check (attempt ${attempt}/10)..."
            sleep 6
          done
          exit 1

      - name: Beta deployment summary
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Beta deployment completed successfully"
            echo "🌐 Beta Marketing: https://beta.yummyrecs.com"
            echo "🌐 Beta App: https://beta.app.yummyrecs.com"
            echo "🌐 Beta Admin: https://beta.admin.yummyrecs.com"
            echo "📋 All tests passed locally via pre-push hook"
          else
            echo "❌ Beta deployment failed"
            echo "📋 Logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    environment:
      name: production
      url: https://app.yummyrecs.com

    steps:
      - uses: actions/checkout@v5

      - name: Deploy to Production Environment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 30m
          envs: GEMINI_API_KEY,GOOGLE_PLACES_API_KEY,POSTHOG_API_KEY,POSTHOG_HOST,SUDO_PASSWORD,FOOD_TRACKER_IOS_TEAM_ID,FOOD_TRACKER_ANDROID_SHA256_CERT_FINGERPRINTS
          script: |
            export GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}"
            export GOOGLE_PLACES_API_KEY="${{ secrets.GOOGLE_PLACES_API_KEY }}"
            export POSTHOG_API_KEY="${{ secrets.POSTHOG_API_KEY }}"
            export POSTHOG_HOST="${{ secrets.POSTHOG_HOST }}"
            export SUDO_PASSWORD="${{ secrets.SUDO_PASSWORD }}"
            export FOOD_TRACKER_IOS_TEAM_ID="${{ secrets.FOOD_TRACKER_IOS_TEAM_ID }}"
            export FOOD_TRACKER_ANDROID_SHA256_CERT_FINGERPRINTS="${{ secrets.FOOD_TRACKER_ANDROID_SHA256_CERT_FINGERPRINTS }}"
            cd /opt/food-tracker-app
            git pull origin main
            bash scripts/deploy.sh production

      - name: Health check Production
        run: |
          for attempt in {1..10}; do
            if curl -fsS https://app.yummyrecs.com/api/health > /dev/null; then
              exit 0
            fi
            echo "Waiting for production API health check (attempt ${attempt}/10)..."
            sleep 6
          done
          exit 1

      - name: Production deployment summary
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Production deployment completed successfully"
            echo "🌐 Production Marketing: https://yummyrecs.com"
            echo "🌐 Production App: https://app.yummyrecs.com"
            echo "🌐 Production Admin: https://admin.yummyrecs.com"
            echo "📋 All tests passed locally via pre-push hook"
          else
            echo "❌ Production deployment failed"
            echo "📋 Logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi

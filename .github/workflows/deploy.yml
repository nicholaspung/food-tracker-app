name: Deploy to Beta/Production

on:
  push:
    branches: [main]
    paths-ignore:
      # The website shares apps/mobile source; only native-only files are ignored.
      - "apps/mobile/ios/**"
      - "apps/mobile/android/**"
      - "apps/mobile/eas.json"
      - "app.config.js"
      - "metro.config.js"
      - ".github/workflows/mobile-*"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        type: choice
        options:
          - production
        default: "production"

permissions:
  contents: read

jobs:
  deploy-beta:
    name: Deploy to Beta
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: beta
      url: https://beta.app.yummyrecs.com

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Deploy to Beta Environment
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 30m
          envs: GEMINI_API_KEY,GOOGLE_PLACES_API_KEY,POSTHOG_API_KEY,POSTHOG_HOST,EXPO_PUSH_ACCESS_TOKEN,FOOD_TRACKER_IOS_TEAM_ID,FOOD_TRACKER_ANDROID_SHA256_CERT_FINGERPRINTS
          script: |
            export GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}"
            export GOOGLE_PLACES_API_KEY="${{ secrets.GOOGLE_PLACES_API_KEY }}"
            export POSTHOG_API_KEY="${{ secrets.POSTHOG_API_KEY }}"
            export POSTHOG_HOST="${{ secrets.POSTHOG_HOST }}"
            export EXPO_PUSH_ACCESS_TOKEN="${{ secrets.EXPO_PUSH_ACCESS_TOKEN }}"
            export FOOD_TRACKER_IOS_TEAM_ID="${{ secrets.FOOD_TRACKER_IOS_TEAM_ID }}"
            export FOOD_TRACKER_ANDROID_SHA256_CERT_FINGERPRINTS="${{ secrets.FOOD_TRACKER_ANDROID_SHA256_CERT_FINGERPRINTS }}"
            cd /opt/food-tracker-app
            git pull origin main
            bash scripts/deploy.sh beta

      - name: Health check Beta
        run: |
          for attempt in {1..10}; do
            if curl -fsS https://beta.app.yummyrecs.com/api/health > /dev/null; then
              exit 0
            fi
            echo "Waiting for beta API health check (attempt ${attempt}/10)..."
            sleep 6
          done
          exit 1

      - name: App link association check Beta
        env:
          FOOD_TRACKER_ANDROID_SHA256_CERT_FINGERPRINTS: ${{ secrets.FOOD_TRACKER_ANDROID_SHA256_CERT_FINGERPRINTS }}
        run: |
          paths=(/.well-known/apple-app-site-association)
          if [ -n "$FOOD_TRACKER_ANDROID_SHA256_CERT_FINGERPRINTS" ]; then
            paths+=(/.well-known/assetlinks.json)
          else
            echo "Skipping Android app-link association check; FOOD_TRACKER_ANDROID_SHA256_CERT_FINGERPRINTS is not set."
          fi

          for path in "${paths[@]}"; do
            body="$(curl -fsS "https://beta.app.yummyrecs.com${path}")"
            if printf '%s' "$body" | grep -qiE '<!doctype html>|<html[[:space:]>]'; then
              echo "Expected app-link association JSON at ${path}, got HTML"
              exit 1
            fi
            BODY="$body" node -e "JSON.parse(process.env.BODY)"
          done

      - name: Beta deployment summary
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Beta deployment completed successfully"
            echo "🌐 Beta Marketing: https://beta.yummyrecs.com"
            echo "🌐 Beta App: https://beta.app.yummyrecs.com"
            echo "🌐 Beta Admin: https://beta.admin.yummyrecs.com"
            echo "📋 All tests passed locally via pre-push hook"
          else
            echo "❌ Beta deployment failed"
            echo "📋 Logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    environment:
      name: production
      url: https://app.yummyrecs.com

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Deploy to Production Environment
        shell: bash
        env:
          APPROVED_SHA: ${{ github.sha }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          if [[ ! "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Refusing Production deploy with invalid approved SHA: $APPROVED_SHA" >&2
            exit 1
          fi

          ssh_directory="$RUNNER_TEMP/production-deploy-ssh"
          install -m 700 -d "$ssh_directory"
          trap 'rm -rf "$ssh_directory"' EXIT

          printf '%s\n' "$VPS_SSH_KEY" > "$ssh_directory/key"
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > "$ssh_directory/known_hosts"
          chmod 600 "$ssh_directory/key" "$ssh_directory/known_hosts"

          printf '%s\n' "$APPROVED_SHA" | timeout 30m ssh \
            -i "$ssh_directory/key" \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_directory/known_hosts" \
            "$VPS_USER@$VPS_HOST"

      - name: Health check Production
        run: |
          for attempt in {1..10}; do
            if curl -fsS https://app.yummyrecs.com/api/health > /dev/null; then
              exit 0
            fi
            echo "Waiting for production API health check (attempt ${attempt}/10)..."
            sleep 6
          done
          exit 1

      - name: App link association check Production
        env:
          FOOD_TRACKER_ANDROID_SHA256_CERT_FINGERPRINTS: ${{ secrets.FOOD_TRACKER_ANDROID_SHA256_CERT_FINGERPRINTS }}
        run: |
          paths=(/.well-known/apple-app-site-association)
          if [ -n "$FOOD_TRACKER_ANDROID_SHA256_CERT_FINGERPRINTS" ]; then
            paths+=(/.well-known/assetlinks.json)
          else
            echo "Skipping Android app-link association check; FOOD_TRACKER_ANDROID_SHA256_CERT_FINGERPRINTS is not set."
          fi

          for path in "${paths[@]}"; do
            body="$(curl -fsS "https://app.yummyrecs.com${path}")"
            if printf '%s' "$body" | grep -qiE '<!doctype html>|<html[[:space:]>]'; then
              echo "Expected app-link association JSON at ${path}, got HTML"
              exit 1
            fi
            BODY="$body" node -e "JSON.parse(process.env.BODY)"
          done

      - name: Production deployment summary
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Production deployment completed successfully"
            echo "🌐 Production Marketing: https://yummyrecs.com"
            echo "🌐 Production App: https://app.yummyrecs.com"
            echo "🌐 Production Admin: https://admin.yummyrecs.com"
            echo "📋 All tests passed locally via pre-push hook"
          else
            echo "❌ Production deployment failed"
            echo "📋 Logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi

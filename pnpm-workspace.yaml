packages:
  - apps/*
  - '!apps/case-calendar'
  - tools/*
  - backend
allowBuilds:
  "@posthog/cli": true
  dtrace-provider: false
  esbuild: true
  msgpackr-extract: false
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.16'
  - '@expo/config@57.0.8'
  - '@expo/fingerprint@0.20.8'
  - '@expo/inline-modules@0.1.6'
  - '@expo/log-box@57.0.3'
  - expo-asset@57.0.12
  - expo-constants@57.0.12
  - expo@57.0.14
  - expo-dev-client@57.0.13
  - expo-dev-launcher@57.0.13
  - expo-dev-menu@57.0.13
  - expo-image-manipulator@57.0.11
  - expo-image-picker@57.0.11
  - expo-location@57.0.11
  - expo-notifications@57.0.12
  - expo-splash-screen@57.0.7
  - expo-updates@57.0.15
packageExtensions:
  posthog-react-native@4.46.3:
    dependencies:
      '@expo/config-plugins': 57.0.8
  react-native-worklets@0.10.1:
    dependencies:
      '@babel/generator': 7.29.7
      '@babel/traverse': 7.29.7
overrides:
  "@babel/core@<=7.29.0": 7.29.7
  brace-expansion@5: 5.0.9
  js-yaml@<=4.1.1: 4.3.1
  "postcss@>=8.5.0 <8.5.18": 8.5.23
  "shell-quote@>=1.1.0 <=1.8.3": 1.10.0
  "uuid@<11.1.1": 11.1.1
  ws@7: 7.5.11
  ws@8: 8.21.0

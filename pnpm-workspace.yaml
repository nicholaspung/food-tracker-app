  - expo@56.0.11
  - '@expo/ui@56.0.17'
  - expo-camera@56.0.8
  - expo-dev-client@56.0.20
  - expo-dev-launcher@56.0.20
  - expo-dev-menu@56.0.17
  - expo-image-manipulator@56.0.18

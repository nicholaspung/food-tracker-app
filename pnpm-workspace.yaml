packages:
  - apps/*
  - '!apps/case-calendar'
  - tools/*
  - backend
allowBuilds:
  "@posthog/cli": true
  dtrace-provider: false
  esbuild: true
  msgpackr-extract: false
  unrs-resolver: true
overrides:
  "@babel/core@<=7.29.0": 7.29.7
  brace-expansion@5: 5.0.9
  js-yaml@<=4.1.1: 4.3.1
  "shell-quote@>=1.1.0 <=1.8.3": 1.10.0
  "uuid@<11.1.1": 11.1.1
  ws@7: 7.5.11
  ws@8: 8.21.0

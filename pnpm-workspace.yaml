  dtrace-provider: false
  esbuild: true
  msgpackr-extract: false
  unrs-resolver: true
overrides:
  "@babel/core@<=7.29.0": 7.29.7
  brace-expansion@5: 5.0.6
  js-yaml@<=4.1.1: 4.2.0
  "shell-quote@>=1.1.0 <=1.8.3": 1.8.4
  "uuid@<11.1.1": 11.1.1
  ws@7: 7.5.11
  ws@8: 8.21.0
minimumReleaseAgeExclude:
  - "@expo/cli@56.1.15"
  - "@expo/log-box@56.0.13"
  - "@expo/metro-config@56.0.14"
  - babel-preset-expo@56.0.15
  - expo-asset@56.0.17
  - expo-constants@56.0.21
  - expo-file-system@56.0.8
  - expo-font@56.0.7
  - expo-modules-core@56.0.16
  - expo-modules-jsi@56.0.9
  - expo@56.0.16
  - '@expo/ui@56.0.22'
  - expo-camera@56.0.8
  - expo-dev-client@56.0.23
  - expo-dev-launcher@56.0.20
  - expo-dev-menu@56.0.17
  - expo-image-manipulator@56.0.22
  - expo-image-picker@56.0.21
  - expo-location@56.0.21
  - expo-media-library@56.0.7
  - expo-notifications@56.0.21
  - expo-splash-screen@56.0.13
  - expo-sqlite@56.0.5
  - expo-updates@56.0.22
  - expo-video@56.1.4
  - jest-expo@56.0.5
patchedDependencies:
  expo-notifications@56.0.21: patches/expo-notifications@56.0.21.patch

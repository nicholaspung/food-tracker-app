services:
  pocketbase:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: mobile-tracker-pocketbase:latest
    container_name: pocketbase
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8090"  # Only accessible from localhost
    volumes:
      # CRITICAL: These bind mounts persist data on the VPS disk
      - ./backend/pb_data_production:/pb/pb_data   # Database and uploads (production)
      - ./backend/pb_migrations:/pb/pb_migrations  # Migration files
      - ./backend/pb_hooks:/pb/pb_hooks            # Custom hooks
      - ./backend/pb_public:/pb/pb_public          # Static files
    environment:
      - TZ=America/Los_Angeles
      - ENCRYPTION_KEY=${ENCRYPTION_KEY_PROD:-}
      - GOMEMLIMIT=460MiB
      - APP_URL=https://myexperiment.life
    command: ["pocketbase", "serve", "--http=0.0.0.0:8090", "--dir=/pb/pb_data"]

    # Resource limits (prevent OOM kills)
    deploy:
      resources:
        limits:
          cpus: '1.0'      # Limit to 1 CPU core
          memory: 512M     # Limit to 512MB RAM
        reservations:
          cpus: '0.5'      # Reserve 0.5 CPU core
          memory: 256M     # Reserve 256MB RAM

    # Enhanced health check
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8090/api/health"]
      interval: 30s        # Check every 30 seconds
      timeout: 10s         # Timeout after 10 seconds
      retries: 3           # Retry 3 times before marking unhealthy
      start_period: 10s    # Wait 10 seconds before first check

    # Security: Entrypoint drops to non-root after fixing permissions
    # user: "1000:1000"  # Commented out to allow entrypoint to fix permissions

    # Logging configuration (prevent disk fill)
    logging:
      driver: "json-file"
      options:
        max-size: "10m"    # Max log file size
        max-file: "3"      # Keep 3 log files

# No frontend service - React is just static files!
# No Caddy service - Caddy runs on host via systemd

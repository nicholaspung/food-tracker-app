<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Screenshot Review</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="sidebar-header-row">
            <h1>Screenshot Review</h1>
            <button id="refresh-button" class="secondary-button refresh-button" type="button">Refresh</button>
          </div>
          <p>Pick an artifact run to compare images, or switch to baseline view to browse a baseline set.</p>
        </div>

        <label class="field">
          <span>Baseline Set</span>
          <div class="baseline-set-row">
            <select id="baseline-set-select"></select>
            <button id="add-baseline-button" class="secondary-button add-baseline-button" type="button">Add</button>
          </div>
        </label>

        <label class="field">
          <span>Environment Filter</span>
          <select id="env-filter-select">
            <option value="all">All Environments</option>
            <option value="local">Local</option>
            <option value="beta">Beta</option>
            <option value="production">Production</option>
            <option value="unknown">Unclassified</option>
          </select>
        </label>

        <div class="sidebar-section">
          <div class="section-heading">
            <h2>Artifact Runs</h2>
            <span id="run-count" class="meta"></span>
          </div>
          <div id="run-list" class="run-list"></div>
        </div>
      </aside>

      <main class="content">
        <div class="content-header">
          <div>
            <h2 id="current-run-title">Select a run</h2>
            <p id="status-message" class="status-message">Waiting for artifact selection.</p>
            <div id="regression-alert" class="regression-alert is-hidden"></div>
          </div>
          <div class="carousel-toolbar">
            <button id="view-mode-button" class="secondary-button" type="button">View Baselines</button>
            <button id="prev-image-button" class="secondary-button" type="button" disabled>Back</button>
            <p id="carousel-position" class="carousel-position">0 of 0</p>
            <button id="next-image-button" class="secondary-button" type="button" disabled>Next</button>
          </div>
        </div>

        <section id="image-grid" class="carousel-stage"></section>
      </main>
    </div>

    <template id="image-card-template">
      <article class="image-card">
        <div class="image-card-header">
          <div>
            <h3 class="image-name"></h3>
          </div>
          <button class="primary-button promote-button" type="button">Move To Baseline</button>
        </div>

        <div class="comparison-grid">
          <section class="preview-panel artifact-panel">
            <h4>Artifact</h4>
            <div class="screen-frame artifact-wrap">
              <img class="artifact-image" alt="" loading="lazy" />
              <p class="empty-state artifact-empty-state">Missing artifact screenshot.</p>
            </div>
          </section>

          <section class="preview-panel baseline-panel">
            <h4>Baseline</h4>
            <div class="screen-frame baseline-wrap">
              <img class="baseline-image" alt="" loading="lazy" />
              <p class="empty-state">No baseline image yet.</p>
            </div>
          </section>
        </div>
      </article>
    </template>

    <div id="action-modal" class="modal-backdrop is-hidden">
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="action-modal-title">
        <h2 id="action-modal-title">Confirm Action</h2>
        <p id="action-modal-message" class="meta"></p>
        <label id="action-modal-input-wrap" class="field modal-input-wrap is-hidden">
          <span id="action-modal-input-label">Name</span>
          <input id="action-modal-input" type="text" />
        </label>
        <div class="modal-actions">
          <button id="action-modal-cancel" class="secondary-button" type="button">Cancel</button>
          <button id="action-modal-confirm" class="primary-button" type="button">Confirm</button>
        </div>
      </div>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>

appId: com.anonymous.yummy-recs-mobile
---
- assertVisible:
    id: onboarding-screen
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 01-onboarding

- tapOn:
    id: onboarding-create-account-button
- assertVisible:
    id: signup-screen
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: 02-create-account

- scrollUntilVisible:
    element:
      id: signup-login-instead-button
    direction: DOWN
- tapOn:
    id: signup-login-instead-button
- assertVisible:
    id: login-screen
- waitForAnimationToEnd:
    timeout: 1200
- takeScreenshot: 03-login

- tapOn:
    id: login-forgot-password-button
- assertVisible:
    id: forgot-password-screen
- waitForAnimationToEnd:
    timeout: 1200
- takeScreenshot: 04-forgot-password
- scrollUntilVisible:
    element:
      id: screen-back-button
    direction: UP
- tapOn:
    id: screen-back-button
- assertVisible:
    id: login-screen
- waitForAnimationToEnd:
    timeout: 1200
- takeScreenshot: 04b-login-before-input

- tapOn:
    id: login-email-input
- eraseText
- inputText: ${LOGIN_EMAIL}

- tapOn:
    id: login-password-input
- eraseText
- inputText: ${LOGIN_PASSWORD}
- pressKey: ENTER
- waitForAnimationToEnd:
    timeout: 800

- tapOn:
    id: login-submit-button
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible:
    id: home-screen
- assertVisible:
    id: tab-Home
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: 05-home

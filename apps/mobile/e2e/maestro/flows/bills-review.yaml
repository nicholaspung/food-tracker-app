appId: com.anonymous.yummy-recs-mobile
---
- assertVisible:
    id: misc-page

- scrollUntilVisible:
    element:
      id: feature-tip-calculator
    direction: DOWN
- tapOn:
    id: feature-tip-calculator
- assertVisible:
    id: tip-calculator-screen
- takeScreenshot: 34-tip-calculator

- tapOn:
    id: screen-back-button
- assertVisible:
    id: misc-page

- scrollUntilVisible:
    element:
      id: feature-bill-splitter
    direction: DOWN
- tapOn:
    id: feature-bill-splitter
- assertVisible:
    id: bills-screen
- takeScreenshot: 35-bills-you-owe

- tapOn:
    text: All
    retryTapIfNoChange: true
- assertVisible:
    id: bills-screen
- takeScreenshot: 36-bills-all

- tapOn:
    text: "You're Owed"
    retryTapIfNoChange: true
- assertVisible:
    id: bills-screen
- takeScreenshot: 37-bills-youre-owed

- tapOn:
    text: Settled
    retryTapIfNoChange: true
- assertVisible:
    id: bills-screen
- takeScreenshot: 38-bills-settled

- tapOn:
    id: bills-create-button
- assertVisible: Split Type
- takeScreenshot: 39-create-bill

- scrollUntilVisible:
    element:
      text: Payer & Owed Amounts
    direction: DOWN
- assertVisible: Total Bill Price
- takeScreenshot: 40-create-bill-lower

- tapOn:
    id: screen-back-button
- assertVisible:
    id: bills-screen

- tapOn:
    point: "30%,36%"
    retryTapIfNoChange: true
- assertVisible: Summary
- takeScreenshot: 41-bill-detail

- scrollUntilVisible:
    element:
      text: Delete Bill
    direction: DOWN
- assertVisible: Items
- takeScreenshot: 42-bill-detail-bottom

- scrollUntilVisible:
    element:
      text: Summary
    direction: UP
- assertVisible: Summary
- tapOn:
    point: "74%,12%"
    retryTapIfNoChange: true
- assertVisible: Bill Name
- takeScreenshot: 43-edit-bill

- scrollUntilVisible:
    element:
      text: Tax, Tip, Fees
    direction: DOWN
- assertVisible: Items
- takeScreenshot: 44-edit-bill-items-tax

- scrollUntilVisible:
    element:
      text: Final Price
    direction: DOWN
- assertVisible: Payer & Owed Amounts
- takeScreenshot: 45-edit-bill-final-owed

- tapOn:
    id: screen-back-button
- assertVisible: Summary

- tapOn:
    id: screen-back-button
- assertVisible:
    id: bills-screen

- tapOn:
    id: screen-back-button
- assertVisible:
    id: misc-page

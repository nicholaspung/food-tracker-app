appId: com.anonymous.yummy-recs-mobile
---
- assertVisible:
    id: misc-page

- scrollUntilVisible:
    element:
      id: feature-tip-calculator
    direction: DOWN
- tapOn:
    id: feature-tip-calculator
- assertVisible:
    id: tip-calculator-screen
- takeScreenshot: 34-tip-calculator
- tapOn:
    id: tip-mode-custom
    retryTapIfNoChange: true
- waitForAnimationToEnd:
    timeout: 2500
- scrollUntilVisible:
    element:
      id: tip-custom-amount
    direction: DOWN
- assertVisible:
    id: tip-custom-amount
- takeScreenshot: 34d-tip-calculator-specific-amount
- tapOn:
    text: Tip Mode
- waitForAnimationToEnd:
    timeout: 1000
- scrollUntilVisible:
    element:
      id: screen-back-button
    direction: UP

- tapOn:
    id: screen-back-button
- assertVisible:
    id: misc-page

- scrollUntilVisible:
    element:
      id: feature-bill-splitter
    direction: DOWN
- tapOn:
    id: feature-bill-splitter
- assertVisible:
    id: bills-screen
- takeScreenshot: 35-bills-you-owe

- tapOn:
    text: All
    retryTapIfNoChange: true
- assertVisible:
    id: bills-screen
- takeScreenshot: 36-bills-all

- tapOn:
    text: "You're Owed"
    retryTapIfNoChange: true
- assertVisible:
    id: bills-screen
- takeScreenshot: 37-bills-youre-owed

- tapOn:
    text: Settled
    retryTapIfNoChange: true
- assertVisible:
    id: bills-screen
- takeScreenshot: 38-bills-settled

- tapOn:
    id: bills-create-button
- assertVisible: Split Type
- takeScreenshot: 39-create-bill
- tapOn:
    id: bill-split-mode-custom
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 39c-create-bill-custom
- scrollUntilVisible:
    element:
      id: bill-split-mode-manual
    direction: UP
- tapOn:
    id: bill-split-mode-manual
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 39k-create-bill-manual

- scrollUntilVisible:
    element:
      id: bill-payer-owed-section
    direction: DOWN
- assertVisible: Total Bill Price
- takeScreenshot: 40-create-bill-lower
- scrollUntilVisible:
    element:
      id: screen-back-button
    direction: UP

- tapOn:
    id: screen-back-button
- assertVisible:
    id: bills-screen

- tapOn:
    point: "30%,36%"
    retryTapIfNoChange: true
- assertVisible: Summary
- takeScreenshot: 41-bill-detail

- scrollUntilVisible:
    element:
      text: Delete Bill
    direction: DOWN
- assertVisible: Items
- takeScreenshot: 42-bill-detail-bottom

- scrollUntilVisible:
    element:
      text: Summary
    direction: UP
- assertVisible: Summary
- tapOn:
    id: bill-detail-edit-button
- assertVisible: Bill Name
- takeScreenshot: 43-edit-bill

- scrollUntilVisible:
    element:
      text: Tax, Tip, Fees
    direction: DOWN
- assertVisible: Items
- takeScreenshot: 44-edit-bill-items-tax

- scrollUntilVisible:
    element:
      id: bill-payer-owed-section
    direction: DOWN
- assertVisible:
    id: bill-payer-owed-section
- takeScreenshot: 45-edit-bill-final-owed
- scrollUntilVisible:
    element:
      id: screen-back-button
    direction: UP

- tapOn:
    id: screen-back-button
- assertVisible: Summary

- tapOn:
    id: screen-back-button
- assertVisible:
    id: bills-screen

- tapOn:
    id: screen-back-button
- assertVisible:
    id: misc-page

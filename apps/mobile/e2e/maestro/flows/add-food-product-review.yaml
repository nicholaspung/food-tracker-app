appId: com.yummyrecs.mobile
---
- tapOn:
    id: tab-AddVisit
- assertVisible:
    id: add-visit-selector
- takeScreenshot: 77-add-tab-food-product

- tapOn:
    id: add-option-food-product
- assertVisible:
    id: food-product-screen
- takeScreenshot: 78-food-product

- scrollUntilVisible:
    element:
      text: Category (Optional)
    direction: DOWN
- assertVisible:
    id: rating-legend-toggle
- runFlow:
    when:
      visible: "Don't eat"
    commands:
      - tapOn:
          id: rating-legend-toggle
- takeScreenshot: 79-food-product-rating-guide

- tapOn:
    id: rating-legend-toggle
- waitForAnimationToEnd:
    timeout: 1200
- takeScreenshot: 80-food-product-rating-guide-expanded

- tapOn:
    id: rating-legend-toggle
- waitForAnimationToEnd:
    timeout: 1200
- tapOn:
    id: food-product-rating-1
- assertVisible:
    id: food-product-rating-2
- takeScreenshot: 81-food-product-rating-1

- tapOn:
    id: food-product-rating-2
- assertVisible:
    id: food-product-rating-4
- takeScreenshot: 82-food-product-rating-2

- tapOn:
    id: food-product-rating-4
- assertVisible:
    id: food-product-rating-5
- takeScreenshot: 83-food-product-rating-4

- tapOn:
    id: food-product-rating-5
- takeScreenshot: 84-food-product-rating-5

- tapOn: Cancel
- assertVisible:
    id: add-visit-selector

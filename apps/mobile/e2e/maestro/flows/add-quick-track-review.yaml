appId: com.yummyrecs.mobile
---
- tapOn:
    id: tab-AddVisit
- assertVisible:
    id: add-visit-selector
- takeScreenshot: 77-add-tab-quick-track

- tapOn:
    id: add-option-quick-track
- assertVisible:
    id: quick-track-screen
- takeScreenshot: 78-quick-track-item

- scrollUntilVisible:
    element:
      text: Category (Optional)
    direction: DOWN
- assertVisible:
    id: rating-legend-toggle
- runFlow:
    when:
      visible: "Don't eat"
    commands:
      - tapOn:
          id: rating-legend-toggle
- takeScreenshot: 79-quick-track-rating-guide

- tapOn:
    id: rating-legend-toggle
- waitForAnimationToEnd:
    timeout: 1200
- takeScreenshot: 80-quick-track-rating-guide-expanded

- tapOn:
    id: rating-legend-toggle
- waitForAnimationToEnd:
    timeout: 1200
- tapOn:
    id: quick-track-rating-1
- assertVisible:
    id: quick-track-rating-2
- takeScreenshot: 81-quick-track-rating-1

- tapOn:
    id: quick-track-rating-2
- assertVisible:
    id: quick-track-rating-4
- takeScreenshot: 82-quick-track-rating-2

- tapOn:
    id: quick-track-rating-4
- assertVisible:
    id: quick-track-rating-5
- takeScreenshot: 83-quick-track-rating-4

- tapOn:
    id: quick-track-rating-5
- takeScreenshot: 84-quick-track-rating-5

- tapOn: Cancel
- assertVisible:
    id: add-visit-selector

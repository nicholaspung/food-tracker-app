appId: com.yummyrecs.mobile
---
- assertVisible:
    id: friends-screen

- tapOn:
    id: tab-AddVisit
- assertVisible:
    id: add-visit-selector
- takeScreenshot: 52-add-tab

- tapOn:
    id: add-option-restaurant-visit
- assertVisible: Track Restaurant Visit
- takeScreenshot: 53-track-restaurant-visit

- tapOn:
    id: create-visit-search-toggle
- assertVisible: Add new restaurant
- takeScreenshot: 54-track-visit-search-expanded

- tapOn:
    id: create-visit-add-restaurant-link
- assertVisible: Add New Restaurant
- takeScreenshot: 55-add-new-restaurant

- tapOn: Cancel
- assertVisible: Track Restaurant Visit

- scrollUntilVisible:
    element:
      id: create-visit-saved-restaurant-option-0
    direction: DOWN
- tapOn:
    id: create-visit-saved-restaurant-option-0
- waitForAnimationToEnd:
    timeout: 1200
- scrollUntilVisible:
    element:
      id: create-visit-scan-menu-photo-button
    direction: UP
- takeScreenshot: 56-first-your-restaurant

- tapOn:
    id: create-visit-scan-menu-photo-button
- assertVisible: Scan Menu Photo
- takeScreenshot: 57-scan-menu-photo

- tapOn: Back to Menu Items
- waitForAnimationToEnd:
    timeout: 1200
- assertVisible: Track Restaurant Visit
- takeScreenshot: 58-after-menu-scan-cancel

- tapOn: Cancel
- assertVisible: Track Restaurant Visit
- assertVisible: Search for food places
- takeScreenshot: 59-after-items-cancel

- tapOn: Continue
- waitForAnimationToEnd:
    timeout: 1200
- assertVisible:
    id: create-visit-scan-menu-photo-button

- tapOn:
    id: create-visit-tip-button
    retryTapIfNoChange: true
- assertVisible:
    id: create-visit-tip-close-button
- takeScreenshot: 60-item-entry-tip

- tapOn:
    id: create-visit-tip-close-button
- assertVisible:
    id: create-visit-scan-menu-photo-button

- tapOn:
    id: create-visit-add-menu-item-button
- assertVisible: Add Menu Item
- takeScreenshot: 61-add-menu-item

- tapOn: Cancel
- waitForAnimationToEnd:
    timeout: 1200
- assertVisible: Track Restaurant Visit
- takeScreenshot: 62-after-add-menu-item-cancel

- scrollUntilVisible:
    element:
      id: create-visit-menu-item-option-0
    direction: DOWN
- tapOn:
    id: create-visit-menu-item-option-0
- tapOn: Rate Items
- waitForAnimationToEnd:
    timeout: 1200
- assertVisible: Track Restaurant Visit
- scrollUntilVisible:
    element:
      id: rating-legend-toggle
    direction: UP
- takeScreenshot: 63-selected-menu-item-rating

- tapOn:
    id: rating-legend-toggle
- tapOn:
    id: rating-legend-toggle
- takeScreenshot: 64-rating-guide-expanded

- tapOn:
    id: rating-legend-toggle

- scrollUntilVisible:
    element:
      id: create-visit-rating-0-1
    direction: DOWN
- tapOn:
    id: create-visit-rating-0-1
- takeScreenshot: 65-rating-1

- tapOn:
    id: create-visit-rating-0-2
- takeScreenshot: 66-rating-2

- tapOn:
    id: create-visit-rating-0-4
- takeScreenshot: 67-rating-4

- tapOn:
    id: create-visit-rating-0-5
- takeScreenshot: 68-rating-5

- tapOn: Save Visit
- assertVisible:
    id: home-screen
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: 69-home-new-visit

- tapOn:
    id: home-first-visit-edit-button
- assertVisible: Edit Restaurant Visit
- takeScreenshot: 70-edit-visit

- scrollUntilVisible:
    element:
      text: Notes
    direction: DOWN
- takeScreenshot: 71-edit-visit-lower

- tapOn: Back
- assertVisible: Edit Restaurant Visit
- assertVisible:
    id: create-visit-scan-menu-photo-button
- takeScreenshot: 72-edit-visit-items

- tapOn: Cancel
- assertVisible: Edit Restaurant Visit
- assertVisible: Search for food places
- takeScreenshot: 73-edit-visit-restaurant

- tapOn: Cancel
- assertVisible:
    id: home-screen

- tapOn:
    id: home-first-visit-delete-button
- waitForAnimationToEnd:
    timeout: 1200
- takeScreenshot: 74-delete-visit-confirmation

- tapOn:
    point: "10%,20%"
    retryTapIfNoChange: true
- waitForAnimationToEnd:
    timeout: 1200
- assertVisible:
    id: home-screen

- tapOn:
    id: home-feed-mode-friends
- assertVisible:
    id: home-screen
- takeScreenshot: 75-home-friends

- tapOn:
    id: home-feed-mode-mine
- assertVisible:
    id: home-screen
- takeScreenshot: 76-home-mine
